<div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-8">
  <app-checkout-stepper current="done" />

  @if (result(); as result) {
    <section
      class="mx-auto mt-8 max-w-xl rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm sm:p-8"
      aria-labelledby="success-title"
    >
      <span
        class="mx-auto grid size-14 place-items-center rounded-full bg-emerald-50 text-emerald-600"
      >
        <app-icon name="check-circle" [size]="30" />
      </span>
      <h1
        id="success-title"
        class="mt-4 text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl"
      >
        Pagamento confirmado!
      </h1>
      <p class="mt-2 text-sm text-slate-500 sm:text-base">
        {{ greeting() }} Sua assinatura está ativa e seu espaço já está pronto para você.
      </p>
      <span
        class="mt-3 inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700"
      >
        <app-icon name="check" [size]="14" />
        Assinatura ativa
      </span>

      <app-purchase-card
        class="mt-6"
        [lines]="lines()"
        [details]="details()"
        totalLabel="Total pago"
        [total]="result.payment.amount"
      />

      <div class="no-print mt-6 grid gap-3 sm:grid-cols-2">
        <button
          type="button"
          class="flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700"
          (click)="startOver()"
        >
          <app-icon name="arrow-right" [size]="16" />
          Fazer nova compra
        </button>
        <button
          type="button"
          class="flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50"
          (click)="print()"
        >
          <app-icon name="printer" [size]="16" />
          Imprimir comprovante
        </button>
      </div>
    </section>

    @if (nextRenewal(); as renewal) {
      <p class="mt-6 text-center text-sm text-slate-500">
        Sua próxima renovação será em {{ renewal | date: 'dd/MM/yyyy' }}.
      </p>
    }
  }
</div>
